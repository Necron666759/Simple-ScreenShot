name: Build Windows Installer (собирается на Linux-раннере)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-on-linux:
    # Сборка идёт на обычном Linux-раннере: PyInstaller запускается под Wine
    # (с настоящим portable Windows Python), а установщики .exe/.msi
    # собираются нативными Linux-инструментами (NSIS, msitools/wixl) —
    # никакой Windows-машины не требуется вообще.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wine, NSIS, msitools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine wine32:i386 wine64 nsis msitools wixl wixl-data zstd curl

      - name: Build .exe / .msi
        working-directory: packaging/windows
        run: ./build-linux.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleScreenshot-Windows-Installers
          path: |
            packaging/windows/dist/SimpleScreenshot-Setup-*.exe
            packaging/windows/dist/SimpleScreenshot-*.msi
            packaging/windows/dist/SimpleScreenshot.exe

